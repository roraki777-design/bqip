[workspace]
members = ["rust/crates/bqip-contracts", "rust/crates/bqip-capture-format", "rust/crates/bqip-binance-collector"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
prost = "=0.13.5"
prost-build = "=0.13.5"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
uuid = { version = "=1.16.0", features = ["v4"] }
crc32c = "=0.6.8"
proptest = "=1.6.0"
tokio = { version = "=1.48.0", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["std", "sink"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
