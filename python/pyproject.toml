[project]
name = "bqip-contract-kernel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "BQIP Brief 001 contract primitives and local capture format"
dependencies = ["protobuf==6.33.6"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# protoc owns these files. Its descriptor imports must execute even when lint
# cannot see their use; runtime checks intentionally precede dependency imports.
# Byte-for-byte regeneration is checked separately. Never apply Ruff fixes here.
"**/bqip/v1/*_pb2.py" = ["E402", "F401", "I001"]
"**/bqip/v1/*_pb2.pyi" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/bqip"]

[[tool.mypy.overrides]]
module = ["bqip.v1.capture_pb2", "bqip.v1.metadata_pb2", "bqip.v1.operational_pb2"]
# protoc 33.6 emits bare Mapping in generated constructor annotations. Preserve
# generated bytes; handwritten adapters and all declared fields stay strict.
disallow_any_generics = false
